<!-- @dsCard height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..600&display=swap">
<style>
html,body{margin:0;padding:0;background:var(--zemin)}
.kapak{position:relative;width:960px;height:300px;overflow:hidden;background:var(--zemin)}
.kapak-svg{position:absolute;inset:0;display:block}
.b-slab{fill:var(--zemin-ters)}
.b-altin{fill:var(--altin-500)}
.b-damga{fill:var(--damga-500)}
.b-vize{fill:var(--vize-500)}
.b-relief{fill:var(--cizgi-belirgin)}
.kapak-amblem{position:absolute;left:523px;top:65px;width:170px;height:170px;display:block}
.kapak-amblem--kagit{display:none}
[data-theme="kagit"] .kapak-amblem--gece{display:none}
[data-theme="kagit"] .kapak-amblem--kagit{display:block}
.kapak-yazi{position:absolute;left:48px;bottom:42px;width:440px}
.kapak-ad{margin:0;font-family:var(--font-baslik);font-size:72px;line-height:.92;font-weight:800;letter-spacing:-.03em;color:var(--metin)}
.kapak-alt{margin:12px 0 0;font-family:var(--font-govde);font-size:14px;line-height:20px;color:var(--metin-silik)}
</style>
<div class="kapak">
<svg class="kapak-svg" viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
<!-- Bloklar: zemin-ters 256x300 tam boy dilim, altin-500 112x160, damga-500 112x80, vize-500 80x112, cizgi-belirgin 80x128; koseler yaricap-xl (24px). Kaplama: %43. -->
<!-- Duzen: tek yuksek dilim + iki uydu sutunu; sutunlar arasi bosluk-4 (16px), sag sutun sag kenara dayanir. -->
<!-- Kapak grafigi: yururlukteki amblem (Logo Kiti 2.0, Fly yonu) zemin-ters dilimin ustune konur. Amblem yeniden cizilmez, assets/Logo/svg icinden dosya olarak gosterilir; dilim tema ile ters dondugu icin amblemin acik/koyu zemin surumu CSS ile secilir. -->
<!-- Olcek: kenarlar 80/112/128/160/256/300 = bosluk-4(16) katlari; koseler yaricap-xl; halka cizgi kalinligi kenar-kalin (2px). -->
<rect x="480" y="0" width="256" height="300" class="b-slab"/>
<rect x="752" y="24"  width="112" height="160" rx="24" class="b-altin"/>
<rect x="752" y="200" width="112" height="80"  rx="24" class="b-damga"/>
<rect x="880" y="24"  width="80"  height="112" rx="24" class="b-vize"/>
<rect x="880" y="152" width="80"  height="128" rx="24" class="b-relief"/>
</svg>
<img class="kapak-amblem kapak-amblem--gece" src="../../assets/Logo/svg/flagquest-fly-amblem-acik.svg" alt="" aria-hidden="true">
<img class="kapak-amblem kapak-amblem--kagit" src="../../assets/Logo/svg/flagquest-fly-amblem-koyu.svg" alt="" aria-hidden="true">
  <div class="kapak-yazi">
    <p class="kapak-ad">FlagQuest</p>
    <p class="kapak-alt">195 bayrak, tek pasaport. Her doğru cevap bir damgadır.</p>
  </div>
</div>
