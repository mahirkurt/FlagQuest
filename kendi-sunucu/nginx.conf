# FlagQuest — Raspberry Pi / kendi sunucu (nginx)
#
# Caddyfile ile aynı kuralların nginx karşılığı. /etc/nginx/sites-available/
# altına koyup sites-enabled'a bağlayın, sonra `sudo nginx -t`.
#
# Sertifika: `sudo certbot --nginx -d flagquest.ornek.com` bu bloğa 443
# dinleyicisini ve ssl_* satırlarını kendisi ekler.

server {
    listen 80;
    listen [::]:80;
    server_name flagquest.ornek.com;   # ALANI DEĞİŞTİRİN

    # dagit.sh'ın atomik takas ettiği simgesel bağ.
    root /srv/flagquest/guncel;
    index index.html;

    # nginx'in mime.types dosyası .webmanifest taşımaz; elle bildirilir.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Parmak izli varlıklar: süresiz --------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Giriş varlıkları: kısa ömür ----------------------------------------
    location ~ ^/(favicon\.svg|favicon\.ico|pwa-\d+x\d+\.png|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Geri kalan her şey: taze + SPA geri dönüşü -------------------------
    # index.html, sw.js, surum.json, manifest.webmanifest ve bütün SPA
    # rotaları buraya düşer. Giriş belgesi önbelleğe girerse yeni dağıtım
    # eski kabuğun arkasında görünmez kalır.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Sondaki `=404` kasıtlı: onsuz nginx /index.html'i iç yeniden yönlendirme
        # olarak dener ve dosya okunamıyorsa (izin hatası, eksik dosya)
        # "rewrite or internal redirection cycle" ile 500 verir. Bu biçimde
        # /index.html düz dosya olarak denenir, hata dürüstçe 404 olur.
        try_files $uri /index.html =404;
    }
}
